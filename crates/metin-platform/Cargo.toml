[package]
name = "metin-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
metin-core.workspace = true
thiserror.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

windows = { version = "=0.62.2", features = ["Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_System_Performance", "Win32_System_Com", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }

[dev-dependencies]
serde_json.workspace = true
