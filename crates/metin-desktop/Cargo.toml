[package]
name = "metin-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[[bin]]
name = "metinbot"
path = "src/main.rs"
[dependencies]
metin-core.workspace = true
metin-platform.workspace = true
metin-vision.workspace = true
eframe.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
thiserror.workspace = true
tempfile.workspace = true
fs2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "=0.17.2"
icu_casemap = "=2.3.0"
notify-rust = "=4.18.2"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[features]
ui-smoke = []

[build-dependencies]
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSObject"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Registry"] }
