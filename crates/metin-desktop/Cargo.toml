[package]
name = "metin-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[[bin]]
name = "companion"
path = "src/main.rs"
[dependencies]
metin-core.workspace = true
metin-platform.workspace = true
metin-vision.workspace = true
eframe.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
thiserror.workspace = true
tempfile.workspace = true
fs2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "=0.17.2"
icu_casemap = "=2.3.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

[features]
ui-smoke = []

[build-dependencies]
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[target.'cfg(windows)'.dependencies]
notify-rust = "=4.18.2"
winit = { version = "=0.30.13", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
