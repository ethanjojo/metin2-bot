name: Rust Windows verification
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/**']
    paths: ['crates/**', 'native/**', 'packaging/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', 'tools/**', 'tests/**', '.github/workflows/rust-ci.yml']
  pull_request:
    paths: ['crates/**', 'native/**', 'packaging/**', 'Cargo.*', 'rust-toolchain.toml', '.gitattributes', 'tools/**', 'tests/**', '.github/workflows/rust-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14.0'
          architecture: x64
      - name: Windows build prerequisites
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'PE tooling installation failed.' }
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain failed.' }
          ./tools/prepare-rust-native.ps1
          ./tools/build-input-bridge.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Input bridge build failed.' }
      - name: Verify Windows
        shell: pwsh
        run: |
          . ./tools/rust-env.ps1
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tooling tests failed.' }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
          cargo test --workspace --all-targets --all-features --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          cargo build --workspace --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          ./target/release/companion.exe --self-test --self-test-report build/selftest-rust.json
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed.' }
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-verification-windows
          retention-days: 14
          path: build/selftest-rust.json
