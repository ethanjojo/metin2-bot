name: Rust Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 75
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14.0'
          architecture: x64
      - name: Build tools
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'PE tooling installation failed.' }
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain failed.' }
          ./tools/prepare-rust-native.ps1
          ./tools/build-input-bridge.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Input bridge build failed.' }
      - name: Release identity and stable acceptance
        id: identity
        shell: pwsh
        run: |
          python -m tools.release_metadata --ref $env:GITHUB_REF --sha $env:GITHUB_SHA --run-number $env:GITHUB_RUN_NUMBER --output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release identity.' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Stable release must tag a commit on main.' }
          }
      - name: Stable release gate
        shell: pwsh
        env:
          RELEASE_PRERELEASE: ${{ steps.identity.outputs.prerelease }}
        run: |
          $policy = Get-Content packaging/release-policy.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_PRERELEASE -ne 'true' -and !$policy.stable_ready) { throw 'Stable acceptance is incomplete.' }
      - name: Verify Rust and release tooling
        shell: pwsh
        run: |
          . ./tools/rust-env.ps1
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tooling tests failed.' }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
          cargo clean -p metin-desktop
          cargo test --workspace --all-targets --all-features --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          cargo test -p metin-desktop --lib --all-features --locked -j 2 sealed_staging_actual_acl -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Protected update staging acceptance failed.' }

      - name: Package Rust Windows installer
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          $compiler = ./tools/prepare_compiler.ps1
          python tools/verify-update-restart.py --compiler $compiler --output build/update-restart-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Installer restart argument acceptance failed.' }
          python tools/verify-update-progress.py --compiler $compiler --output build/update-progress-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Installer progress callback acceptance failed.' }

          $crt = ./tools/find-msvc-crt.ps1
          ./tools/package-rust-windows.ps1 -Version $env:BUILD_VERSION -BuildNumber $env:GITHUB_RUN_NUMBER -CompilerPath $compiler -CrtDirectory $crt -OutputDirectory dist/release
      - name: Hosted install, upgrade, self-test and uninstall
        shell: pwsh
        env:
          INSTALLER_NAME: ${{ steps.identity.outputs.artifact }}
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          ./tools/verify_installer.ps1 -InstallerPath (Join-Path dist/release $env:INSTALLER_NAME) -BundleDirectory dist/release/Companion -Version $env:BUILD_VERSION -CommitSha $env:GITHUB_SHA
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rust-release
          path: |
            dist/release/*.exe
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rust-reports
          path: |
            build/selftest-installed.json
            build/data-migration-installed.json
            build/update-restart-acceptance/result.json
            build/installer*.log
            build/input-driver-*.json
  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-rust-release
          path: dist/release
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          INSTALLER_NAME: ${{ needs.build.outputs.artifact }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          ./tools/publish_release.ps1 -Tag $env:RELEASE_TAG -Version $env:RELEASE_VERSION -CommitSha $env:BUILD_SHA -InstallerName $env:INSTALLER_NAME -Prerelease ($env:RELEASE_PRERELEASE -eq 'true')
