[workspace]
resolver = "3"
members = ["crates/metin-core", "crates/metin-platform", "crates/metin-vision", "crates/metin-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.23.4", features = ["v4", "v5", "serde"] }
thiserror = "=2.0.21"
base64 = "=0.22.1"
metin-core = { path = "crates/metin-core" }
metin-platform = { path = "crates/metin-platform" }
metin-vision = { path = "crates/metin-vision" }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
opencv = { version = "=0.101.1", default-features = false, features = ["imgcodecs", "imgproc", "clang-runtime"] }
clap = { version = "=4.6.7", features = ["derive"] }
tempfile = "=3.27.0"
fs2 = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
incremental = false

[profile.release]
lto = "thin"
strip = "debuginfo"
